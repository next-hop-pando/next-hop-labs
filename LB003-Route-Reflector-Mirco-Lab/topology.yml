provider: clab

defaults:
  device: iol
  devices:
    iol:
      clab:
        image: vrnetlab/cisco_iol:17.12.01

ospf:
  area: 0.0.0.0

nodes:

  c1:
    module: [ ospf ]
    loopback:
      ipv4: 10.0.0.1/32

  c2:
    module: [ ospf ]
    loopback:
      ipv4: 10.0.0.2/32

  rr1:
    module: [ ospf ]
    loopback:
      ipv4: 10.0.0.11/32

  rr2:
    module: [ ospf ]
    loopback:
      ipv4: 10.0.0.12/32

  obs:
    module: [ ospf ]
    loopback:
      ipv4: 10.0.0.100/32

links:

  # C1 to both route reflectors
  - name: C1-RR1
    c1: { ipv4: 10.1.11.1/30 }
    rr1: { ipv4: 10.1.11.2/30 }

  - name: C1-RR2
    c1: { ipv4: 10.1.12.1/30 }
    rr2: { ipv4: 10.1.12.2/30 }

  # C2 to both route reflectors
  - name: C2-RR1
    c2: { ipv4: 10.2.11.1/30 }
    rr1: { ipv4: 10.2.11.2/30 }

  - name: C2-RR2
    c2: { ipv4: 10.2.12.1/30 }
    rr2: { ipv4: 10.2.12.2/30 }

  # Route reflector interconnect
  - name: RR1-RR2
    rr1: { ipv4: 10.11.12.1/30 }
    rr2: { ipv4: 10.11.12.2/30 }

  # Observer to both route reflectors
  - name: OBS-RR1
    obs: { ipv4: 10.100.11.1/30 }
    rr1: { ipv4: 10.100.11.2/30 }

  - name: OBS-RR2
    obs: { ipv4: 10.100.12.1/30 }
    rr2: { ipv4: 10.100.12.2/30 }
