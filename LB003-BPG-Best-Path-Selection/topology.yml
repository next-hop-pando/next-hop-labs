---
provider: clab

defaults:
  device: iol
  devices:
    iol:
      clab:
        image: vrnetlab/cisco_iol:17.12.01

ospf:
  area: 0.0.0.0

# ==============================================================
# Groups
# ==============================================================

groups:
  cisco_routers:
    members: [ r1, r2, r3, r4, r5, r6, r7 ]
    config: [ templates/no-cdp ]

nodes:

  # ============================================================
  # AS65100 - External
  # ============================================================

  r1:
    module: [ bgp ]
    bgp:
      as: 65100
    loopback:
      ipv4: 10.1.1.1/32

  # ============================================================
  # AS65000 - Internal
  # OSPF Area 0 + iBGP full mesh using loopbacks
  # ============================================================

  r2:
    module: [ ospf, bgp ]
    bgp:
      as: 65000
    loopback:
      ipv4: 10.2.2.2/32

  r3:
    module: [ ospf, bgp ]
    bgp:
      as: 65000
    loopback:
      ipv4: 10.3.3.3/32

  r4:
    module: [ ospf, bgp ]
    bgp:
      as: 65000
    loopback:
      ipv4: 10.4.4.4/32

  r5:
    module: [ ospf, bgp ]
    bgp:
      as: 65000
    loopback:
      ipv4: 10.5.5.5/32

  r6:
    module: [ ospf, bgp ]
    bgp:
      as: 65000
    loopback:
      ipv4: 10.6.6.6/32

  # ============================================================
  # AS65200 - External
  # ============================================================

  r7:
    module: [ bgp ]
    bgp:
      as: 65200
    loopback:
      ipv4: 10.7.7.7/32

  # ============================================================
  # Lightweight Linux Test Hosts
  # ============================================================

  host-a:
    device: linux
    image: alpine:latest

  host-b:
    device: linux
    image: alpine:latest

links:

  # ============================================================
  # Host-A LAN - Behind R1 / AS65100
  # ============================================================

  - name: HOST-A-R1
    host-a:
      ipv4: 192.0.2.10/24
    r1:
      ipv4: 192.0.2.1/24

  # ============================================================
  # eBGP - AS65100 <-> AS65000
  # ============================================================

  - name: R1-R2
    r1:
      ipv4: 10.12.12.1/30
    r2:
      ipv4: 10.12.12.2/30

  - name: R1-R4
    r1:
      ipv4: 10.14.14.1/30
    r4:
      ipv4: 10.14.14.2/30

  # ============================================================
  # OSPF Area 0 - AS65000 Internal Links
  # ============================================================

  - name: R2-R3
    r2:
      ipv4: 10.23.23.1/30
    r3:
      ipv4: 10.23.23.2/30

  - name: R3-R4
    r3:
      ipv4: 10.34.34.1/30
    r4:
      ipv4: 10.34.34.2/30

  - name: R2-R6
    r2:
      ipv4: 10.26.26.1/30
    r6:
      ipv4: 10.26.26.2/30

  - name: R4-R5
    r4:
      ipv4: 10.45.45.1/30
    r5:
      ipv4: 10.45.45.2/30

  - name: R5-R6
    r5:
      ipv4: 10.56.56.1/30
    r6:
      ipv4: 10.56.56.2/30

  # ============================================================
  # eBGP - AS65000 <-> AS65200
  # ============================================================

  - name: R6-R7
    r6:
      ipv4: 10.67.67.1/30
    r7:
      ipv4: 10.67.67.2/30

  - name: R5-R7
    r5:
      ipv4: 10.57.57.1/30
    r7:
      ipv4: 10.57.57.2/30

  # ============================================================
  # Host-B LAN - Behind R7 / AS65200
  # ============================================================

  - name: R7-HOST-B
    r7:
      ipv4: 198.51.100.1/24
    host-b:
      ipv4: 198.51.100.10/24
